[package]
name = "bridge-testbed"
version = "0.1.0"
edition = "2021"
description = "Loads assets from every rewrite-bridge provider side by side, to check scale, orientation, animation, materials and physics across games"
license = "MIT OR Apache-2.0"
# Local tool: it needs the owner's own game installs to do anything
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = "0.18"
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "parallel"] }
rewrite-bridge = "0.3.1"
rewrite-bridge-bevy = "0.3.0"

# The providers, by public git revision (their rewrite-bridge 0.3 commits). All of them take rewrite-bridge 0.3 from
# crates.io, like the two lines above, so Cargo.lock holds one copy of it.
wt-unpack = { git = "https://github.com/patodois/wt-unpack", rev = "c06c71cd9d3e57b686b5e98531c681aef18b40a3", features = ["bridge"], optional = true }
wf-unpack = { git = "https://github.com/patodois/wf-unpack", rev = "c482a56e7480335b15f336af96f563430be01ac7", features = ["bridge"], optional = true }
hytale-unpack = { git = "https://github.com/patodois/hytale-unpack", rev = "c29e8db3e98fa86fdbba2b2bf78e8f0e32c4aa3e", optional = true }
nocturne-unpack = { git = "https://github.com/patodois/nocturne-unpack", rev = "355d5787c88c422c8e074592b1f5e1d54b381e49", features = ["bridge"], optional = true }
mc-unpack = { git = "https://github.com/patodois/mc-unpack", rev = "43ef7eff2246cb400843dace1072976103f83814", features = ["bridge"], optional = true }
libc = "0.2"

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_animation",
    "bevy_curve",
    "bevy_camera",
    "bevy_light",
    "bevy_render",
    "bevy_pbr",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "hdr",
    "png",
    "tonemapping_luts",
    "zstd_rust",
    "x11",
    "wayland",
]

[features]
default = ["wt", "wf", "hytale", "nocturne", "mc"]
wt = ["dep:wt-unpack"]
wf = ["dep:wf-unpack"]
hytale = ["dep:hytale-unpack"]
nocturne = ["dep:nocturne-unpack"]
mc = ["dep:mc-unpack"]

# Bevy and the game readers are far too slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"
