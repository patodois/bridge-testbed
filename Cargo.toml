[package]
name = "bridge-testbed"
version = "0.1.0"
edition = "2021"
description = "Loads assets from every rewrite-bridge provider side by side, to check scale, orientation, animation, materials and physics across games"
license = "MIT OR Apache-2.0"
# Local tool: it needs the owner's own game installs to do anything
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = "0.18"
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "parallel"] }
rewrite-bridge = "0.2.2"
rewrite-bridge-bevy = "0.2.2"

# The providers, by public git revision. All of them take rewrite-bridge 0.2 from crates.io, like the two
# lines above, so Cargo.lock holds one copy of it.
wt-unpack = { git = "https://github.com/patodois/wt-unpack", rev = "f9f0515b08ca4256a583b2e86c37857eaa1e2036", features = ["bridge"], optional = true }
wf-unpack = { git = "https://github.com/patodois/wf-unpack", rev = "5db618feec7ec0418d9f23351067b7f286ee03d1", features = ["bridge"], optional = true }
hytale-unpack = { git = "https://github.com/patodois/hytale-unpack", rev = "889a70fd7adbcd10296e40cbac682a0ef786a8df", optional = true }
nocturne-unpack = { git = "https://github.com/patodois/nocturne-unpack", rev = "49df6cc0df8e1d60d9e0b1c6cc84473ee45d28e6", features = ["bridge"], optional = true }
mc-unpack = { version = "0.1.0", features = ["bridge"], optional = true }
libc = "0.2"

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_animation",
    "bevy_curve",
    "bevy_camera",
    "bevy_light",
    "bevy_render",
    "bevy_pbr",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "hdr",
    "png",
    "tonemapping_luts",
    "zstd_rust",
    "x11",
    "wayland",
]

[features]
default = ["wt", "wf", "hytale", "nocturne", "mc"]
wt = ["dep:wt-unpack"]
wf = ["dep:wf-unpack"]
hytale = ["dep:hytale-unpack"]
nocturne = ["dep:nocturne-unpack"]
mc = ["dep:mc-unpack"]

# Bevy and the game readers are far too slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"
