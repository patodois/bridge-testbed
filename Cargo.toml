[package]
name = "bridge-testbed"
version = "0.1.0"
edition = "2021"
description = "Loads assets from every rewrite-bridge provider side by side, to check scale, orientation, animation, materials and physics across games"
license = "MIT OR Apache-2.0"
# Local tool: it needs the owner's own game installs to do anything
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = "0.18"
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "parallel"] }
rewrite-bridge = { git = "https://github.com/patodois/rewrite-bridge", tag = "v0.1.0" }
rewrite-bridge-bevy = { git = "https://github.com/patodois/rewrite-bridge", tag = "v0.1.0" }

# The providers, by public git revision. All of them pin rewrite-bridge at the tag above, so
# Cargo.lock holds one copy of it.
wt-unpack = { git = "https://github.com/patodois/wt-unpack", rev = "b2081dc466a7dfb0748c7e0f347d24f36f1e78ed", features = ["bridge"], optional = true }
wf-unpack = { git = "https://github.com/patodois/wf-unpack", rev = "283c02f403fa464075c37eeccb426e29f02f5c9f", features = ["bridge"], optional = true }
hytale-unpack = { git = "https://github.com/patodois/hytale-unpack", rev = "5ae844ce0e3c33b6afc29f332e79ff933efcee48", optional = true }
nocturne-unpack = { git = "https://github.com/patodois/nocturne-unpack", rev = "623c46412f50cfdb0d950301931244f91cb82b89", features = ["bridge"], optional = true }
libc = "0.2"

# nocturne-unpack reads Unity 2019.4 bundles with a patched copy of rabex 0.2.1 (its vendor/rabex, see its
# NOTES-upstream.md), wired in by a [patch] that only applies in its own workspace. This applies the same
# copy here, from the same public revision.
[patch.crates-io]
rabex = { git = "https://github.com/patodois/nocturne-unpack", rev = "623c46412f50cfdb0d950301931244f91cb82b89" }

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_animation",
    "bevy_curve",
    "bevy_camera",
    "bevy_light",
    "bevy_render",
    "bevy_pbr",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "hdr",
    "png",
    "tonemapping_luts",
    "zstd_rust",
    "x11",
    "wayland",
]

[features]
default = ["wt", "wf", "hytale", "nocturne"]
wt = ["dep:wt-unpack"]
wf = ["dep:wf-unpack"]
hytale = ["dep:hytale-unpack"]
nocturne = ["dep:nocturne-unpack"]

# Bevy and the game readers are far too slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"
