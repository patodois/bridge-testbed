[package]
name = "bridge-testbed"
version = "0.1.0"
edition = "2021"
description = "Loads assets from every rewrite-bridge provider side by side, to check scale, orientation, animation, materials and physics across games"
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "rewrite-bridge", "bevy", "gltf", "assets"]
categories = ["game-development", "rendering"]
# Local tool: it needs the owner's own game installs to do anything
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = "0.18"
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "parallel"] }
rewrite-bridge = "0.4"
rewrite-bridge-bevy = "0.4"

# The providers, by public git revision: the rewrite-bridge 0.4 release commit of each reader, so Cargo.lock holds one copy
# of rewrite-bridge. Each is a cargo feature, so a build can carry only the games you own.
wt-unpack = { git = "https://github.com/patodois/wt-unpack", rev = "090812bd4d3d232e4a1ab1b99e09dbd634031a6c", features = ["bridge"], optional = true }
wf-unpack = { git = "https://github.com/patodois/wf-unpack", rev = "e47563b878e6a28b0eec7579621d5635868beb7d", features = ["bridge"], optional = true }
hytale-unpack = { git = "https://github.com/patodois/hytale-unpack", rev = "a23c089a0daa096ad1ac90b64b081bdcd45f7910", optional = true }
nocturne-unpack = { git = "https://github.com/patodois/nocturne-unpack", rev = "e9a5a8b87b17ffa15e7ec8eaa83cc38095c97140", features = ["bridge"], optional = true }
mc-unpack = { git = "https://github.com/patodois/mc-unpack", rev = "003c9e9a2e95f45c087994225f254de22ef87406", features = ["bridge"], optional = true }
libc = "0.2"

[dependencies.bevy]
version = "0.20"
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_mikktspace",
    "bevy_animation",
    "bevy_curve",
    "bevy_camera",
    "bevy_light",
    "bevy_render",
    "bevy_pbr",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "hdr",
    "png",
    "tonemapping_luts",
    "zstd_rust",
    "x11",
    "wayland",
]

[features]
default = ["wt", "wf", "hytale", "nocturne", "mc"]
wt = ["dep:wt-unpack"]
wf = ["dep:wf-unpack"]
hytale = ["dep:hytale-unpack"]
nocturne = ["dep:nocturne-unpack"]
mc = ["dep:mc-unpack"]

# Bevy and the game readers are far too slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"
