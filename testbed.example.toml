# Copy to testbed.toml (untracked: it holds local paths) and point it at your game installs.
#
#   bridge-testbed                              # the gallery
#   bridge-testbed shots --out shots/a          # fixed 512 x 512 shots of every item
#   bridge-testbed list --provider hytale --filter Trork --limit 10   # find ids for the items below

# Provider names are fixed: wt, wf, hytale, nocturne, mc. A leading ~ in a path is your home folder.
# For one game only, keep its section and its [[items]] and delete the rest (see README.md).
[providers.wt]
# War Thunder's game folder. On macOS:
# /Applications/WarThunderLauncher.app/Contents/WarThunder.app/Contents/Resources/game
path = "/path/to/WarThunder/game"

[providers.wf]
path = "~/Games/Warframe/Cache.Windows"
# Largest side of a baked texture. Keeps a Warframe scene's memory down; leave out for full size.
max_texture = 512

[providers.hytale]
# Assets.zip. Optional: without `path`, the launcher's install on macOS is used,
# ~/Library/Application Support/Hytale/install/release/package/game/latest/Assets.zip
# Set it for any other location:
# path = "/path/to/Hytale/install/release/package/game/latest/Assets.zip"

[providers.nocturne]
# The game folder that holds smt3hd_Data
path = "~/Games/smt3hd"

# NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.
# Minecraft: Java Edition (mc-unpack), read from the client jar of a copy you own. Versions 1.12.2 to 26.3.
# Optional: without `path` the newest jar a launcher installed that mc-unpack can read is used. Where launchers keep it:
#   Prism Launcher, macOS: ~/Library/Application Support/PrismLauncher/libraries/com/mojang/minecraft/<v>/minecraft-<v>-client.jar
#   vanilla launcher, macOS: ~/Library/Application Support/minecraft/versions/<v>/<v>.jar
#   vanilla launcher, Linux: ~/.minecraft/versions/<v>/<v>.jar    Windows: %APPDATA%\.minecraft\versions\<v>\<v>.jar
# Set `path` to pin one version (the jar itself, not the folder). Uncomment this section and the items at the end.
# [providers.mc]
# path = "~/Library/Application Support/PrismLauncher/libraries/com/mojang/minecraft/26.3/minecraft-26.3-client.jar"

[gallery]
columns = 4          # items per row; 0 = one row
gap = 1.5            # metres between neighbouring AABBs
snap_to_ground = false

# Every value in [physics] is a testbed assumption: the bridge carries no physics data yet.
[physics]
density = 1.0        # kg per m3 of hull volume
drop_height = 3.0    # metres from the ground to the lowest point of a dropped prop
gravity = 9.81       # m/s2

# The block the B key stacks as a 3 + 2 + 1 pyramid
[stack]
provider = "hytale"
id = "Server/Item/Items/Rock/Aqua/Rock_Aqua.json"
count = 6

# kind: "model" = Provider::load, "animated" = load_animated (clips), "scene" = load_scene
# dynamic = true: a convex-hull rigid body, dropped with Space
# collide = true: a static trimesh of the render meshes (scenes always get one)
# collision_id: a scene's own collision, where the provider has some (wf: the level with ?collision)
[[items]]
provider = "wt"
id = "tanks/usa_m4a1_76w_sherman.grp:m4a1_76w_sherman"
kind = "model"
label = "Sherman"
collide = true

# wf ids can ask for clips: "<model>?animations=<filter>", filters separated by | (substring or glob)
[[items]]
provider = "wf"
id = "/Lotus/Characters/Tenno/Excalibur/Excalibur_skel.fbx?animations=/Lotus/Animations/Tenno/Movement/MeleeWeapon/Sword/Jog*|/Lotus/Animations/Tenno/Movement/MeleeWeapon/Sword/Sprint*"
kind = "animated"
label = "Excalibur"

[[items]]
provider = "hytale"
id = "Server/Models/Intelligent/Trork/Trork.json"
kind = "animated"
label = "Trork"
dynamic = true

[[items]]
provider = "hytale"
id = "Server/Item/Items/Rock/Aqua/Rock_Aqua.json"
kind = "model"
label = "Block"
dynamic = true

[[items]]
provider = "hytale"
id = "Server/Prefabs/Npc/Kweebec/Oak/Garden_Small/Kweebec_Oak_Garden_Small_003.prefab.json"
kind = "scene"
label = "Prefab"

# Nocturne: a demon with every clip of its animator, and one field prefab as a scene.
# Nocturne has no collision data in the bridge, so the field's static collider is a trimesh of its
# render meshes (a testbed assumption).
[[items]]
provider = "nocturne"
id = "dvl0x01"
kind = "animated"
label = "Demon"

[[items]]
provider = "nocturne"
id = "f014/f014_012"
kind = "scene"
label = "Field"

# Minecraft: Java Edition, uncomment with [providers.mc] above. 1 block = 1 m, so block/stone is a 1 x 1 x 1 m cube like the
